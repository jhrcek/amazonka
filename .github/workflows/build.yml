name: build

# See: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#concurrency.
concurrency:
  group: ${{ github.head_ref }}-${{ github.workflow }}

on:
  pull_request:
    branches: [ main ]
    types:
      - opened
      - synchronize

  push:
    branches: [ main ]
    paths-ignore:
      - "configs/**"
      - "scripts/**"
      - ".envrc"
      - ".gitignore"
      - "LICENSE"
      - "**.md"

jobs:
  amazonka-gen:
    runs-on: ubuntu-latest

    steps:
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            extra-substituters = https://cache.iog.io
            experimental-features = nix-command flakes
            allow-import-from-derivation = true

      - uses: cachix/cachix-action@v17
        with:
          name: amazonka
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - uses: actions/checkout@v6

      - run: nix build

  amazonka-lib:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ghc: ghc96 # Latest mainline GHC
          - os: ubuntu-latest
            ghc: ghc94 # Most industrially-relevant GHC
          - os: ubuntu-latest
            ghc: ghc90 # Catch errors due to simplified subsumption

          - os: macos-latest
            ghc: ghc94

    runs-on: ${{ matrix.os }}

    steps:
      - if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |-
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt &

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            extra-substituters = https://cache.iog.io
            experimental-features = nix-command flakes
            allow-import-from-derivation = true

      - uses: cachix/cachix-action@v17
        with:
          name: amazonka
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - uses: actions/checkout@v6

      - name: cabal update && cabal freeze
        run: |
          nix develop '.#${{matrix.ghc}}' --print-build-logs --command \
              bash -c 'cabal update && cabal freeze'

      - uses: actions/cache@v5
        with:
          key: v1-${{ runner.os }}-${{ matrix.ghc }}-${{ hashFiles('cabal.project.freeze') }}
          restore-keys: |
            v1-${{ runner.os }}-${{ matrix.ghc }}-
          path: |
            ~/.cabal/store
            dist-newstyle

      # Verifies that every Linux-only dev-shell change in flake.nix is
      # individually load-bearing. Builds zlib-0.7.1.1 in-place via its own
      # Setup.hs (which bypasses cabal's package store, so each case really
      # re-runs hsc2hs and re-links the probe) under four env mutations:
      #   1. full env              -> must succeed
      #   2. LD_LIBRARY_PATH unset -> must fail (libzstd.so.1 unresolvable)
      #   3. PKG_CONFIG_PATH unset -> must fail (header/runtime mismatch
      #                              triggers stack-protector canary)
      #   4. both unset            -> must fail
      # If any "must fail" case accidentally succeeds, this step fails the
      # workflow so we notice the redundancy and can remove the env var.
      - name: verify dev-shell env vars are each required
        if: runner.os == 'Linux'
        run: |
          nix develop '.#${{matrix.ghc}}' --print-build-logs --command bash <<'OUTER'
          set -eu

          # Build a throwaway 1-line library that depends on zlib-0.7.1.1
          # via cabal new-build (the same code path the real CI uses), so
          # the probe is linked exactly the way it is in production.
          WORK=$(mktemp -d)
          export CABAL_DIR="$WORK/cabal-dir"
          cd "$WORK"
          mkdir -p probe && cd probe
          cat > probe.cabal <<'EOF'
          cabal-version: 2.0
          name: probe
          version: 0.1
          build-type: Simple
          library
            build-depends: base, zlib
            default-language: Haskell2010
          EOF
          cat > cabal.project <<'EOF'
          packages: .
          constraints: zlib == 0.7.1.1
          EOF
          cabal update >/dev/null

          # Pre-warm: full env, populates CABAL_DIR with hsc2hs and zlib.
          # If this fails, the rest of the test is meaningless.
          cabal build >/dev/null

          zap_zlib_from_store () {
            rm -rf dist-newstyle
            # Remove any zlib-0.7.1.1-* package-id directory from the store
            # so the next cabal build genuinely re-runs hsc2hs and re-links
            # the probe rather than reusing a cached store entry.
            find "$CABAL_DIR/store" -maxdepth 4 -type d -name 'zlib-0.7.1.1-*' \
              -exec chmod -R +w {} + -exec rm -rf {} + 2>/dev/null || true
          }

          run_case () {
            local label=$1 expect=$2 ; shift 2
            zap_zlib_from_store
            echo "===== $label ====="
            local actual=ok log
            log=$(mktemp)
            if "$@" cabal build >>"$log" 2>&1 ; then
              actual=ok
            else
              actual=fail
            fi
            echo "outcome=$actual (expected=$expect)"
            if [ "$actual" != "$expect" ]; then
              echo "------ tail of build log ------"
              tail -60 "$log"
              echo "------"
              echo "FAIL: $label expected $expect but got $actual"
              return 1
            fi
          }

          run_case "1. full env (must succeed)"                  ok   env
          run_case "2. LD_LIBRARY_PATH unset (must fail)"        fail env -u LD_LIBRARY_PATH
          run_case "3. PKG_CONFIG_PATH unset (must fail)"        fail env -u PKG_CONFIG_PATH
          run_case "4. both unset (must fail)"                   fail env -u LD_LIBRARY_PATH -u PKG_CONFIG_PATH
          OUTER

      - name: cabal build core
        run: |
          nix develop '.#${{matrix.ghc}}' --print-build-logs --command \
              bash -c 'cabal build amazonka-core amazonka'

      - name: cabal build s3-encryption
        run: |
          nix develop '.#${{matrix.ghc}}' --print-build-logs --command \
              bash -c 'cabal build amazonka-s3-encryption'

      - name: cabal build all
        run: |
          nix develop '.#${{matrix.ghc}}' --print-build-logs --command \
              bash -c 'cabal test all'
