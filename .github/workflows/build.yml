name: build

# See: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#concurrency.
concurrency:
  group: ${{ github.head_ref }}-${{ github.workflow }}

on:
  pull_request:
    branches: [ main ]
    types:
      - opened
      - synchronize

  push:
    branches: [ main ]
    paths-ignore:
      - "configs/**"
      - "scripts/**"
      - ".envrc"
      - ".gitignore"
      - "LICENSE"
      - "**.md"

jobs:
  amazonka-gen:
    runs-on: ubuntu-latest

    steps:
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            extra-substituters = https://cache.iog.io
            experimental-features = nix-command flakes
            allow-import-from-derivation = true

      - uses: cachix/cachix-action@v17
        with:
          name: amazonka
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - uses: actions/checkout@v6

      - run: nix build

  amazonka-lib:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ghc: ghc96 # Latest mainline GHC
          - os: ubuntu-latest
            ghc: ghc94 # Most industrially-relevant GHC
          - os: ubuntu-latest
            ghc: ghc90 # Catch errors due to simplified subsumption

          - os: macos-latest
            ghc: ghc94

    runs-on: ${{ matrix.os }}

    steps:
      - if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |-
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt &

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            extra-substituters = https://cache.iog.io
            experimental-features = nix-command flakes
            allow-import-from-derivation = true

      - uses: cachix/cachix-action@v17
        with:
          name: amazonka
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - uses: actions/checkout@v6

      - name: cabal update && cabal freeze
        run: |
          nix develop '.#${{matrix.ghc}}' --print-build-logs --command \
              bash -c 'cabal update && cabal freeze'

      - uses: actions/cache@v5
        with:
          key: v1-${{ runner.os }}-${{ matrix.ghc }}-${{ hashFiles('cabal.project.freeze') }}
          restore-keys: |
            v1-${{ runner.os }}-${{ matrix.ghc }}-
          path: |
            ~/.cabal/store
            dist-newstyle

      - name: debug -- inspect dev-shell GHC closure
        run: |
          nix develop '.#${{matrix.ghc}}' --print-build-logs --command bash -c '
            set -x
            which ghc
            GHC_LIBDIR=$(ghc --print-libdir)
            echo "GHC_LIBDIR=$GHC_LIBDIR"
            echo "--- readelf -d on the real ghc ELF ---"
            readelf -d "$GHC_LIBDIR"/bin/ghc-* | grep -E "NEEDED|RUNPATH|RPATH" || true
            echo "--- ldd on the real ghc ELF ---"
            ldd "$GHC_LIBDIR"/bin/ghc-* 2>&1 | head -40 || true
            echo "--- env vars relevant to linking ---"
            env | grep -E "NIX_LDFLAGS|NIX_CFLAGS|LIBRARY_PATH|LD_LIBRARY_PATH|PKG_CONFIG_PATH" || true
          '

      - name: cabal build core
        run: |
          nix develop '.#${{matrix.ghc}}' --print-build-logs --command \
              bash -c 'cabal build amazonka-core amazonka'

      - name: debug -- inspect zlib hsc2hs probe (runs on failure too)
        if: always()
        run: |
          nix develop '.#${{matrix.ghc}}' --print-build-logs --command bash -c '
            set -x
            PROBE=$(find dist-newstyle ~/.cabal -name "Stream_hsc_make" 2>/dev/null | head -1)
            echo "PROBE=$PROBE"
            if [ -n "$PROBE" ]; then
              echo "--- file ---"
              file "$PROBE" || true
              echo "--- readelf -d ---"
              readelf -d "$PROBE" | grep -E "NEEDED|RUNPATH|RPATH" || true
              echo "--- ldd ---"
              ldd "$PROBE" 2>&1 || true
              echo "--- attempt to run it ---"
              "$PROBE" 2>&1 || echo "exit=$?"
            else
              echo "no Stream_hsc_make probe found"
              find dist-newstyle ~/.cabal -name "*.hsc_make" 2>/dev/null || true
            fi
            echo "--- linker command line cabal used (if any logs) ---"
            find dist-newstyle -name "setup-config" -o -name "*.log" 2>/dev/null \
              | xargs -I{} sh -c "echo === {} ===; cat {}" 2>/dev/null \
              | grep -E "rpath|RUNPATH|-L/nix|hsc2hs|Stream_hsc" | head -40 || true
          '

      - name: cabal build s3-encryption
        run: |
          nix develop '.#${{matrix.ghc}}' --print-build-logs --command \
              bash -c 'cabal build amazonka-s3-encryption'

      - name: cabal build all
        run: |
          nix develop '.#${{matrix.ghc}}' --print-build-logs --command \
              bash -c 'cabal test all'
