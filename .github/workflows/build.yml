name: build

# See: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#concurrency.
concurrency:
  group: ${{ github.head_ref }}-${{ github.workflow }}

on:
  pull_request:
    branches: [ main ]
    types:
      - opened
      - synchronize

  push:
    branches: [ main ]
    paths-ignore:
      - "configs/**"
      - "scripts/**"
      - ".envrc"
      - ".gitignore"
      - "LICENSE"
      - "**.md"

jobs:
  amazonka-gen:
    runs-on: ubuntu-latest

    steps:
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            extra-substituters = https://cache.iog.io
            experimental-features = nix-command flakes
            allow-import-from-derivation = true

      - uses: cachix/cachix-action@v17
        with:
          name: amazonka
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - uses: actions/checkout@v6

      - run: nix build

  amazonka-lib:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ghc: ghc96 # Latest mainline GHC
          - os: ubuntu-latest
            ghc: ghc94 # Most industrially-relevant GHC
          - os: ubuntu-latest
            ghc: ghc90 # Catch errors due to simplified subsumption

          - os: macos-latest
            ghc: ghc94

    runs-on: ${{ matrix.os }}

    steps:
      - if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |-
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt &

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            extra-substituters = https://cache.iog.io
            experimental-features = nix-command flakes
            allow-import-from-derivation = true

      - uses: cachix/cachix-action@v17
        with:
          name: amazonka
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - uses: actions/checkout@v6

      - name: cabal update && cabal freeze
        run: |
          nix develop '.#${{matrix.ghc}}' --print-build-logs --command \
              bash -c 'cabal update && cabal freeze'

      - uses: actions/cache@v5
        with:
          key: v1-${{ runner.os }}-${{ matrix.ghc }}-${{ hashFiles('cabal.project.freeze') }}
          restore-keys: |
            v1-${{ runner.os }}-${{ matrix.ghc }}-
          path: |
            ~/.cabal/store
            dist-newstyle

      # Verifies that every Linux-only flake.nix change for the dev shell is
      # individually load-bearing. Builds zlib-0.7.1.1 in isolation under
      # four configurations:
      #   1. full env       -> must succeed (sanity)
      #   2. LD_LIBRARY_PATH unset -> must fail (libzstd.so.1 unresolvable)
      #   3. PKG_CONFIG_PATH unset -> must fail (header/runtime mismatch
      #                              triggers stack-protector canary)
      #   4. both unset     -> must fail
      # If any "must fail" case accidentally succeeds, the step fails the
      # build so we notice the redundancy and can remove it.
      - name: verify dev-shell env vars are each required
        if: runner.os == 'Linux'
        run: |
          nix develop '.#${{matrix.ghc}}' --print-build-logs --command bash <<'OUTER'
          set -u
          WORK=$(mktemp -d)
          cd "$WORK"
          cabal get zlib-0.7.1.1 >/dev/null
          cd zlib-0.7.1.1

          run_case () {
            local label=$1 expect=$2 ; shift 2
            rm -rf dist-newstyle
            local log
            log=$(mktemp)
            echo "===== $label ====="
            ( "$@" cabal build --offline 2>&1 ) > "$log" || true
            local outcome=ok
            grep -qE 'stack smashing detected|libzstd\.so\.1: cannot open' "$log" && outcome=fail
            grep -qE '^Linking ' "$log" || outcome=${outcome:-fail}
            grep -q 'Failed to build zlib' "$log" && outcome=fail
            echo "outcome=$outcome (expected=$expect)"
            if [ "$outcome" != "$expect" ]; then
              echo "------ tail of build log ------"
              tail -40 "$log"
              echo "------"
              echo "FAIL: $label expected $expect but got $outcome"
              return 1
            fi
          }

          run_case "1. full env (must succeed)" ok env
          run_case "2. LD_LIBRARY_PATH unset (must fail)" fail env -u LD_LIBRARY_PATH
          run_case "3. PKG_CONFIG_PATH unset (must fail)" fail env -u PKG_CONFIG_PATH
          run_case "4. both unset (must fail)" fail env -u LD_LIBRARY_PATH -u PKG_CONFIG_PATH
          OUTER

      - name: cabal build core
        run: |
          nix develop '.#${{matrix.ghc}}' --print-build-logs --command \
              bash -c 'cabal build amazonka-core amazonka'

      - name: cabal build s3-encryption
        run: |
          nix develop '.#${{matrix.ghc}}' --print-build-logs --command \
              bash -c 'cabal build amazonka-s3-encryption'

      - name: cabal build all
        run: |
          nix develop '.#${{matrix.ghc}}' --print-build-logs --command \
              bash -c 'cabal test all'
